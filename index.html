<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Яков Шахов — стихи</title>
  <meta name="description" content="Стихи Якова Шахова: философская, городская, любовная, пейзажная и гражданская лирика, переводы, сонеты, басни.">
  <script>
    /* Тема: сохранённая пользователем или системная. Ставим атрибут до отрисовки. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="logo" href="#home">Яков <span>Шахов</span></a>
      <nav class="main">
        <a href="#poems">Стихи</a>
        <!-- <a href="admin.html">Добавить стих</a> -->
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="shareBtn" type="button" title="Поделиться" aria-label="Поделиться">
          <svg class="icon-share" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
        </button>
        <button class="theme-toggle" id="themeToggle" type="button" title="Переключить тему" aria-label="Переключить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app">
    <noscript>Для работы сайта включите JavaScript.</noscript>
  </main>

  <footer class="site">
    <div class="wrap">
      © Яков Шахов. Все произведения — собственность автора.
    </div>
  </footer>

  <script src="data/author.js"></script>

  <script src="assets/app.js"></script>
</body>
</html>
